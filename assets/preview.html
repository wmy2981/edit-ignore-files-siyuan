<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>编辑同步忽略 · 预览图</title>
<!--
  这张图按插件的真实界面 1:1 还原：DOM 结构与 src/editorDialog.ts 生成的完全一致，
  样式取自思源自身的 dialog / button 规则（app/src/assets/scss/component/_dialog.scss、
  _button.scss、daylight 主题变量）和本插件 src/index.scss。不画任何插件里不存在的元素。
-->
<style>
    :root {
        --b3-theme-primary: #3575f0;
        --b3-theme-primary-lighter: rgba(53, 117, 240, .38);
        --b3-theme-primary-lightest: rgba(53, 117, 240, .12);
        --b3-theme-background: #fff;
        --b3-theme-surface: #f6f6f6;
        --b3-theme-surface-lighter: #e0e0e0;
        --b3-theme-on-background: #222;
        --b3-theme-on-surface: #5f6368;
        --b3-theme-on-surface-light: rgba(95, 99, 104, .68);
        --b3-font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        --b3-font-family-code: "JetBrains Mono", Consolas, "Liberation Mono", monospace;
        --b3-border-color: var(--b3-theme-surface-lighter);
        --b3-border-radius: 6px;
        --b3-border-radius-b: 12px;
        --b3-mask-background: rgba(220, 220, 220, .4);
        --b3-card-warning-color: #8a4f00;
        --b3-dialog-shadow: 0 8px 24px rgba(0, 0, 0, .2);
        --b3-list-hover: rgba(0, 0, 0, .075);
        --b3-button-shadow: 0 1px 2px 0 rgb(0 0 0 / .3), 0 1px 3px 1px rgb(0 0 0 / .15);
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        width: 1024px;
        height: 768px;
        margin: 0;
        overflow: hidden;
        background-color: var(--b3-theme-background);
        color: var(--b3-theme-on-background);
        font-family: var(--b3-font-family);
        font-size: 16px;
    }

    /* ---- 思源 Dialog（component/_dialog.scss） ---- */
    .b3-dialog {
        position: fixed;
        top: 0;
        left: 0;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        display: flex;
        font-size: var(--b3-font-size, 16px);
    }

    .b3-dialog__scrim {
        background-color: var(--b3-mask-background);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 1;
    }

    .b3-dialog__container {
        outline: none;
        border-radius: var(--b3-border-radius-b);
        background-color: var(--b3-theme-surface);
        position: relative;
        box-shadow: var(--b3-dialog-shadow);
        display: flex;
        flex-direction: column;
        flex-grow: 0;
        flex-shrink: 0;
        box-sizing: border-box;
        max-width: 88vw;
        border: 1px solid var(--b3-theme-surface-lighter);
    }

    .b3-dialog__header {
        cursor: default;
        padding: 9px 16px;
        line-height: 24px;
        font-size: 16px;
        font-weight: 500;
        border-bottom: 1px solid var(--b3-theme-surface-lighter);
    }

    .b3-dialog__body {
        overflow: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .b3-dialog__content {
        padding: 16px;
        word-break: break-all;
        flex: 1;
        overflow: auto;
    }

    .b3-dialog__action {
        padding: 7px 16px;
        border-top: 1px solid var(--b3-theme-surface-lighter);
        display: flex;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        user-select: none;
    }

    /* ---- 思源按钮（component/_button.scss） ---- */
    .b3-button {
        cursor: pointer;
        color: var(--b3-theme-on-primary, ButtonText);
        border-radius: var(--b3-border-radius, 4px);
        line-height: 20px;
        padding: 4px 8px;
        background-color: var(--b3-theme-primary, ButtonFace);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        box-sizing: border-box;
        text-align: center;
        font-family: inherit;
        font-size: 13px;
    }

    .b3-button--text {
        color: var(--b3-theme-primary);
        background-color: transparent;
    }

    .b3-button--cancel {
        color: var(--b3-theme-on-surface);
        background-color: transparent;
    }

    .fn__space {
        width: 8px;
        display: inline-block;
        flex-shrink: 0;
    }

    .b3-label__text {
        color: var(--b3-theme-on-surface);
        font-size: 12px;
    }

    /* ---- 本插件样式（src/index.scss） ---- */
    .b3-dialog__container.eds-dialog {
        will-change: transform;
    }

    .eds {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        gap: 8px;
        box-sizing: border-box;
        overflow: hidden;
        will-change: transform;
    }

    .eds__guide {
        flex-shrink: 0;
        border-bottom: 1px solid var(--b3-theme-surface-lighter);
        padding-bottom: 8px;
    }

    .eds__guide summary {
        cursor: pointer;
        color: var(--b3-theme-on-surface);
        font-size: 13px;
        opacity: .86;
    }

    .eds__guide-list {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--b3-theme-on-surface-light);
        font-size: 12px;
        line-height: 18px;
    }

    .eds__lint {
        flex-shrink: 0;
        max-height: 84px;
        overflow: auto;
        color: var(--b3-card-warning-color, var(--b3-theme-on-surface));
        font-size: 12px;
        line-height: 18px;
    }

    .eds__editor {
        display: flex;
        flex: 1;
        min-height: 0;
        border: 1px solid var(--b3-border-color);
        border-radius: var(--b3-border-radius);
        overflow: hidden;
        background-color: var(--b3-theme-background);
    }

    .eds__gutter,
    .eds__textarea {
        font-family: var(--b3-font-family-code);
        font-size: 13px;
        line-height: 20px;
        padding: 8px 0;
    }

    .eds__gutter {
        flex: 0 0 auto;
        min-width: 22px;
        padding-right: 6px;
        padding-left: 4px;
        overflow: hidden;
        text-align: right;
        color: var(--b3-theme-on-surface-light);
        background-color: var(--b3-theme-surface);
        border-right: 1px solid var(--b3-theme-surface-lighter);
        user-select: none;
    }

    .eds__gutter > div {
        height: 20px;
    }

    .eds__textarea {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        resize: none;
        padding-left: 8px;
        padding-right: 8px;
        background-color: transparent;
        color: var(--b3-theme-on-background);
        white-space: pre;
        overflow: auto;
    }
</style>
</head>
<body>
<div class="b3-dialog">
    <div class="b3-dialog__scrim"></div>
    <div role="dialog" aria-modal="true" tabindex="-1" class="b3-dialog__container eds-dialog"
        style="width:720px;height:538px;left:auto;top:auto">
        <div class="resize__move b3-dialog__header">编辑同步忽略</div>
        <div class="b3-dialog__body">
            <div class="b3-dialog__content eds">
                <details class="eds__guide">
                    <summary>编辑指导</summary>
                    <ul class="eds__guide-list">
                        <li>每行一条规则，以 data 目录为基准，例如 /assets/ 或 /assets/*.pdf。</li>
                        <li># 开头是注释，! 开头表示取消忽略（取反），* 匹配任意字符，** 匹配多级目录。</li>
                        <li>建议以 / 开头，避免同名路径被误匹配；排除整个目录时写成 /目录/。</li>
                        <li>路径分隔符用 /，不要用反斜杠；行尾不要留空格。</li>
                        <li>文件里可能包含其他工具写入的规则，本插件不会自动调整它们；保存后规则在下次同步时生效。</li>
                    </ul>
                </details>
                <div class="eds__editor">
                    <div class="eds__gutter" aria-hidden="true"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div></div>
                    <textarea class="eds__textarea" wrap="off" spellcheck="false" placeholder="每行一条规则，例如 /assets/*.pdf"># 忽略附件里的 PDF 与临时目录
/assets/*.pdf
temp/**
/storage/view-state.json
!assets/manual/*.pdf
temp/**
</textarea>
                </div>
            </div>
            <div class="b3-dialog__action">
                <button class="b3-button b3-button--cancel">取消</button>
                <div class="fn__space"></div>
                <button class="b3-button b3-button--text">保存</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
