<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>编辑忽略文件 · 预览图</title>
<!--
  按插件真实界面 1:1 还原：DOM 与 src/editorDialog.ts 生成的一致，样式取自思源的
  dialog / button 规则与 src/index.scss。隐藏节点（语法提示行、关闭图标、缩放手柄）不画。
-->
<style>
    :root {
        --b3-theme-primary: #3575f0;
        --b3-theme-primary-lighter: rgba(53, 117, 240, .38);
        --b3-theme-primary-lightest: rgba(53, 117, 240, .12);
        --b3-theme-background: #fff;
        --b3-theme-surface: #f6f6f6;
        --b3-theme-surface-lighter: #e0e0e0;
        --b3-theme-on-background: #222;
        --b3-theme-on-surface: #5f6368;
        --b3-theme-on-surface-light: rgba(95, 99, 104, .68);
        --b3-font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        --b3-font-family-code: "JetBrains Mono", Consolas, "Liberation Mono", monospace;
        --b3-border-color: var(--b3-theme-surface-lighter);
        --b3-border-radius: 6px;
        --b3-border-radius-b: 12px;
        --b3-mask-background: rgba(220, 220, 220, .4);
        --b3-card-warning-color: #8a4f00;
        --b3-card-error-color: #b3261e;
        --b3-theme-error: #b3261e;
        --b3-theme-primary-light: rgba(53, 117, 240, .54);
        --b3-theme-primary-lighter: rgba(53, 117, 240, .38);
        --b3-menu-background: var(--b3-theme-background);
        --b3-select-background: url("data:image/svg+xml;utf8,<svg fill='rgba(95, 99, 104, .68)' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>") no-repeat right 2px center var(--b3-menu-background);
        --b3-dialog-shadow: 0 8px 24px rgba(0, 0, 0, .2);
        --b3-list-hover: rgba(0, 0, 0, .075);
        --b3-button-shadow: 0 1px 2px 0 rgb(0 0 0 / .3), 0 1px 3px 1px rgb(0 0 0 / .15);
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        width: 1024px;
        height: 768px;
        margin: 0;
        overflow: hidden;
        background-color: var(--b3-theme-background);
        color: var(--b3-theme-on-background);
        font-family: var(--b3-font-family);
        font-size: 16px;
    }

    /* ---- 思源 Dialog（component/_dialog.scss） ---- */
    .b3-dialog {
        position: fixed;
        top: 0;
        left: 0;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        display: flex;
        font-size: var(--b3-font-size, 16px);
    }

    .b3-dialog__scrim {
        background-color: var(--b3-mask-background);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 1;
    }

    .b3-dialog__container {
        outline: none;
        border-radius: var(--b3-border-radius-b);
        background-color: var(--b3-theme-surface);
        position: relative;
        box-shadow: var(--b3-dialog-shadow);
        display: flex;
        flex-direction: column;
        flex-grow: 0;
        flex-shrink: 0;
        box-sizing: border-box;
        max-width: 88vw;
        border: 1px solid var(--b3-theme-surface-lighter);
    }

    .b3-dialog__header {
        cursor: default;
        padding: 9px 16px;
        line-height: 24px;
        font-size: 16px;
        font-weight: 500;
        border-bottom: 1px solid var(--b3-theme-surface-lighter);
    }

    .b3-dialog__body {
        overflow: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .b3-dialog__content {
        padding: 16px;
        word-break: break-all;
        flex: 1;
        overflow: auto;
    }

    .b3-dialog__action {
        padding: 7px 16px;
        border-top: 1px solid var(--b3-theme-surface-lighter);
        display: flex;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        user-select: none;
    }

    /* ---- 思源按钮（component/_button.scss） ---- */
    .b3-button {
        cursor: pointer;
        color: var(--b3-theme-on-primary, ButtonText);
        border-radius: var(--b3-border-radius, 4px);
        line-height: 20px;
        padding: 4px 8px;
        background-color: var(--b3-theme-primary, ButtonFace);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        box-sizing: border-box;
        text-align: center;
        font-family: inherit;
        font-size: 13px;
    }

    .b3-button--text {
        color: var(--b3-theme-primary);
        background-color: transparent;
    }

    .b3-button--cancel {
        color: var(--b3-theme-on-surface);
        background-color: transparent;
    }

    .b3-button--outline {
        color: var(--b3-theme-primary);
        box-shadow: inset 0 0 0 .6px var(--b3-theme-primary);
        background-color: transparent;
    }

    /* ---- 思源下拉框（component/_select.scss） ---- */
    .b3-select {
        border: 0;
        border-radius: var(--b3-border-radius);
        padding: 4px 26px 4px 8px;
        box-sizing: border-box;
        line-height: 20px;
        color: var(--b3-theme-on-background);
        height: 28px;
        font-size: 14px;
        font-family: inherit;
        box-shadow: inset 0 0 0 1px var(--b3-border-color);
        background: var(--b3-select-background);
        appearance: none;
        cursor: pointer;
        overflow: hidden;
    }

    /* ---- 文件切换条与说明（src/index.scss） ---- */
    .eds__files.b3-select {
        flex-shrink: 0;
        align-self: flex-start;
        max-width: 100%;
        font-size: 13px;
    }

    .eds__desc {
        flex-shrink: 0;
        color: var(--b3-theme-on-surface-light);
        font-size: 12px;
        line-height: 18px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .fn__space {
        width: 8px;
        display: inline-block;
        flex-shrink: 0;
    }

    .b3-label__text {
        color: var(--b3-theme-on-surface);
        font-size: 12px;
    }

    /* ---- 本插件样式（src/index.scss） ---- */
    .b3-dialog__container.eds-dialog {
        will-change: transform;
    }

    .eds {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        gap: 8px;
        box-sizing: border-box;
        overflow: hidden;
        will-change: transform;
    }

    .eds__guide {
        flex-shrink: 0;
        border-bottom: 1px solid var(--b3-theme-surface-lighter);
        padding-bottom: 8px;
    }

    .eds__guide summary {
        cursor: pointer;
        color: var(--b3-theme-on-surface);
        font-size: 13px;
        opacity: .86;
    }

    .eds__guide-list {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--b3-theme-on-surface-light);
        font-size: 12px;
        line-height: 18px;
    }

    .eds__notice {
        flex-shrink: 0;
        color: var(--b3-card-warning-color, var(--b3-theme-on-surface));
        font-size: 12px;
        line-height: 18px;
    }

    .eds__lint {
        flex-shrink: 0;
        max-height: 84px;
        overflow: auto;
        color: var(--b3-card-error-color, var(--b3-theme-error));
        font-size: 12px;
        line-height: 18px;
        will-change: transform;
    }

    .eds__lint[hidden] {
        display: none;
    }

    .eds__editor {
        display: flex;
        flex: 1;
        min-height: 0;
        border: 1px solid var(--b3-border-color);
        border-radius: var(--b3-border-radius);
        overflow: hidden;
        background-color: var(--b3-theme-background);
    }

    .eds__gutter,
    .eds__textarea {
        font-family: var(--b3-font-family-code);
        font-size: 13px;
        line-height: 20px;
        padding: 8px 0;
    }

    .eds__gutter {
        flex: 0 0 auto;
        min-width: 22px;
        padding-right: 6px;
        padding-left: 4px;
        overflow: hidden;
        text-align: right;
        color: var(--b3-theme-on-surface-light);
        background-color: var(--b3-theme-surface);
        border-right: 1px solid var(--b3-theme-surface-lighter);
        user-select: none;
    }

    .eds__gutter > div {
        height: 20px;
    }

    .eds__textarea {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        resize: none;
        padding-left: 8px;
        padding-right: 8px;
        background-color: transparent;
        color: var(--b3-theme-on-background);
        white-space: pre;
        overflow: auto;
        will-change: transform;
        font-size: 16px;
    }

    @media (min-width: 721px) {
        .eds__textarea {
            font-size: 13px;
        }
    }
</style>
</head>
<body>
<div class="b3-dialog">
    <div class="b3-dialog__scrim"></div>
    <div role="dialog" aria-modal="true" tabindex="-1" class="b3-dialog__container eds-dialog"
        style="width:720px;height:461px;left:auto;top:auto">
        <div class="resize__move b3-dialog__header">编辑忽略文件</div>
        <div class="b3-dialog__body">
            <div class="b3-dialog__content eds">
                <select class="b3-select eds__files" aria-label="编辑忽略文件">
                    <option value="syncignore" selected>syncignore</option>
                    <option value="indexignore">indexignore</option>
                    <option value="embeddingignore">embeddingignore</option>
                    <option value="searchignore">searchignore</option>
                    <option value="refsearchignore">refsearchignore</option>
                </select>
                <div class="eds__desc b3-label__text">控制哪些文件参与数据同步与快照，路径以 data 目录为基准。</div>
                <details class="eds__guide">
                    <summary>语法说明</summary>
                    <ul class="eds__guide-list">
                        <li>每行一条规则，如 /assets/、/assets/*.pdf、**/temp/**；# 开头是注释，! 开头取消忽略。</li>
                        <li>路径分隔符用 /；反斜杠在内核里按正则转义处理，写错会让整条规则失效。</li>
                        <li>内核还会追加内置规则（/.siyuan/conf.json、用户指南、/storage/view-state.json 等），这些不用写在这里。</li>
                        <li>保存后规则在下次数据同步时生效。</li>
                    </ul>
                </details>
                <div class="eds__lint b3-label__text" hidden></div>
                <div class="eds__editor">
                    <div class="eds__gutter" aria-hidden="true"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div></div>
                    <textarea class="eds__textarea" wrap="off" spellcheck="false" placeholder="每行一条规则，例如 /assets/*.pdf"># 忽略附件里的 PDF 与临时目录
/assets/*.pdf
temp/**
/storage/view-state.json
!assets/manual/*.pdf
temp/**
</textarea>
                </div>
            </div>
            <div class="b3-dialog__action">
                <button class="b3-button b3-button--cancel">取消</button>
                <div class="fn__space"></div>
                <button class="b3-button b3-button--text">保存</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
